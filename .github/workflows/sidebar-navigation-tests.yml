name: Native sidebar navigation tests

on:
  pull_request:
    paths:
      - .github/workflows/sidebar-navigation-tests.yml
      - src/cascadia/TerminalApp/**
      - src/cascadia/LocalTests_TerminalApp/**
      - src/cascadia/TerminalSettingsModel/**

permissions:
  contents: read

jobs:
  native-sidebar:
    name: Native sidebar navigation
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify source revision
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_HEAD) {
            throw 'Checked-out source differs from the pull request head.'
          }
      - name: Build native test host
        shell: cmd
        run: |
          call tools\razzle.cmd
          if errorlevel 1 exit /b 1
          msbuild OpenConsole.slnx /t:"Terminal\Tests\TestHostApp" /p:Configuration=Debug /p:Platform=x64 /p:WindowsTerminalBranding=Dev /p:GenerateAppxPackageOnBuild=false /m:4 /nologo /v:minimal
      - name: Install test host framework dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $recipe = 'bin\x64\Debug\TestHostApp\TestHostApp.build.appxrecipe'
          $dependencies = @(& .\build\scripts\Get-DependenciesFromAppxRecipe.ps1 -Path $recipe)
          if (-not $dependencies.Count) { throw 'Test host framework dependencies are missing.' }
          $expectedNames = @('Microsoft.UI.Xaml.2.8', 'Microsoft.VCLibs.140.00.Debug')
          $publisher = 'CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US'
          foreach ($dependency in $dependencies) {
            $archive = [IO.Compression.ZipFile]::OpenRead($dependency.FullName)
            try {
              $entry = $archive.GetEntry('AppxManifest.xml')
              if (-not $entry) { throw 'Framework package has no manifest.' }
              $reader = [IO.StreamReader]::new($entry.Open())
              try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            } finally { $archive.Dispose() }
            $identity = $manifest.Package.Identity
            if ($identity.Name -notin $expectedNames -or $identity.Publisher -ne $publisher -or
                $identity.ProcessorArchitecture -ne 'x64' -or
                -not [Xml.XmlConvert]::ToBoolean([string]$manifest.Package.Properties.Framework)) {
              throw 'Recipe dependency is not an expected Microsoft x64 framework.'
            }
            $installed = @(Get-AppxPackage -Name $identity.Name | Where-Object {
              $_.Architecture -eq 'x64' -and $_.Publisher -eq $publisher -and
                [version]$_.Version -ge [version]$identity.Version
            })
            if (-not $installed.Count) { Add-AppxPackage -Path $dependency.FullName }
          }
      - name: Run sidebar navigation regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $output = Join-Path $root 'Generated Files\native-sidebar-navigation'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $runner = Join-Path $root 'packages\Microsoft.Taef.10.100.251104001\build\Binaries\x64\TE.exe'
          $log = Join-Path $output 'results.log'
          Push-Location 'bin\x64\Debug\TestHostApp'
          try {
            & $runner '.\TerminalApp.LocalTests.dll' '/name:*TabTests::SidebarNavigationHotkeys*' /logOutput:High /sessionTimeout:0:10 *> $log
            $code = $LASTEXITCODE
          } finally { Pop-Location }
          Get-Content -LiteralPath $log
          $text = Get-Content -LiteralPath $log -Raw
          $expected = 'Summary: Total=2, Passed=2, Failed=0, Blocked=0, Not Run=0, Skipped=0'
          if ($code -ne 0 -or -not $text.Contains($expected)) {
            throw "Native sidebar navigation tests did not both pass (exit=$code)."
          }
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-sidebar-navigation-${{ github.event.pull_request.head.sha }}
          path: Generated Files/native-sidebar-navigation
          if-no-files-found: warn
          retention-days: 14
